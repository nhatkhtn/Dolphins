[project]
name = "dolphins-smoke"
version = "0.1.0"
description = "Minimal env to run one Dolphins forward pass on a pinned DriveBench sample"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "open_clip_torch==2.16.0",
    "transformers==4.33.2",
    "accelerate>=0.30",
    "huggingface_hub>=0.24",
    "peft==0.9.0",
    "einops==0.7.0",
    "einops_exts==0.0.4",
    "Pillow>=10.1.0",
    "numpy==1.26.4",
    "opencv-python-headless==4.5.5.64",
    "braceexpand==0.1.7",
    "requests==2.31.0",
    "sentencepiece",
    "protobuf",
]

[tool.uv]
index-strategy = "unsafe-best-match"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
